name: Cars CRUD Tests

# TODO: add the pull_request event filtered to the main branch
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      # TODO: checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # TODO: set up Python 3.12
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # TODO: install requirements-dev.txt
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # TODO: install Chromium and its Linux dependencies
      # 若项目用 Playwright：
      - name: Install Chromium and system deps
        run: |
          pip install playwright
          playwright install chromium --with-deps

      # TODO: run unit tests
      - name: Run unit tests
        run: pytest tests/unit -v --cov

      # TODO: run integration tests
      - name: Run integration tests
        run: pytest tests/integration -v

      # TODO: run API tests
      - name: Run API tests
        run: pytest tests/api -v

      # TODO: run E2E tests
      - name: Run E2E tests
        run: pytest tests/e2e -v
        env:
          # Playwright 在 CI 中常用无头模式
          PLAYWRIGHT_HEADFUL: 0
