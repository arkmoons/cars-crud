name: Cars CRUD Tests
# TODO: add the pull_request event filtered to the main branch
on:
 push:
  branches: [main]

permissions:
  contents: read
jobs:
  tests:
   runs-on: ubuntu-latest
   steps:
     - name: checkout the repository
       uses: actions/checkout@v4
     - name: set up Python 3.12
       uses: actions/setup-Python@v5
       with:
           python-version: "3.12"
           cache: pip
     - name: Install dev dependencies
       run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
     - name: install  Chromium and its Linux dependencies
       run: |
          pip install playwright
          playwright install chromium --with-deps
     - name: run unit tests
       run: pytest test/unit -v --cov
     - name: run integration tests
       run: pytest test/integration -v  
     - name: run api tests
       run: pytest test/API -v  
     - name: run e2e tests
       run: pytest test/E2E -v  
